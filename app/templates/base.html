<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IARA System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">IARA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/ships/page">{{ t("nav_ships") }}</a></li>
                    <li class="nav-item"><a class="nav-link" href="/permits/page">{{ t("nav_permits") }}</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tickets/page">{{ t("nav_tickets") }}</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">{{ t("nav_contact") }}</a></li>
                    <!-- Добавен линк за персонал тук: -->
                    <li class="nav-item"><a class="nav-link" href="/admin/login">Staff</a></li>
                    <li class="nav-item ms-lg-2">
                        <a href="/set-lang/en" class="btn btn-sm {% if lang == 'en' %}btn-light{% else %}btn-outline-light{% endif %} me-1">EN</a>
                        <a href="/set-lang/bg" class="btn btn-sm {% if lang == 'bg' %}btn-light{% else %}btn-outline-light{% endif %}">BG</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
